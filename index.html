<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidade Nova Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">CIDADE NOVA STORE</div>

  <nav>
    <button class="tab-btn active" data-tab="veiculos">Veículos</button>
    <button class="tab-btn" data-tab="skins">Skins</button>
    <button class="tab-btn" data-tab="casas">Casas</button>
    <button class="tab-btn" data-tab="vips">VIPs</button>
    <button class="tab-btn" data-tab="favelas">Favelas</button>
  </nav>

  <div class="cart-btn" onclick="toggleCart()">
    🛒 Carrinho (<span id="cart-count">0</span>)
  </div>
</header>

<main>
  <section id="products-container"></section>
</main>

<div id="cart" class="cart hidden">
  <h2>Seu Carrinho</h2>
  <div id="cart-items"></div>

  <input type="text" id="discordUser" placeholder="Seu Discord Ex: usuario#0001">

  <div class="cart-footer">
    <h3>Total: R$ <span id="cart-total">0</span></h3>
    <button onclick="checkout()">Pagar com PIX</button>
  </div>
</div>

<div id="pix-modal" class="pix-modal hidden">
  <div class="pix-content">
    <h2>Pagamento PIX</h2>

    <img id="pix-qrcode" src="" alt="QR Code PIX">

    <textarea id="pix-code" readonly></textarea>

    <button onclick="copyPix()">Copiar PIX</button>

    <a id="discord-link" href="https://discord.gg/seudiscord" target="_blank">
      Entrar no Discord
    </a>
  </div>
</div>

<script src="products.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
